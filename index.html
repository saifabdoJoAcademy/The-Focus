<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <meta name="viewport" content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1,
                   user-scalable=no,
                   viewport-fit=cover">

  <title>The Focus</title>

  <meta name="description" content="">

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;
      background: #000;

      position: fixed;

      overscroll-behavior: none;

      /* iPhone safe-area support */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);

      box-sizing: border-box;
    }

    #unity-container {
      /*
         * Almost fullscreen while still leaving
         * a small amount of space around the game.
         */
      width: 98vw;
      height: 94dvh;

      position: fixed;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      max-width: 100vw;
      max-height: 100dvh;

      box-sizing: border-box;
    }

    #unity-canvas-container {
      width: 100%;
      height: 100%;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;

      display: block;

      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;

      touch-action: none;
    }

    /*
       * Center the Unity logo and loading bar together.
       */
    #unity-loading-bar {
      position: absolute;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);
    }

    #unity-logo {
      margin-bottom: 15px;
    }

    #unity-progress-bar-empty {
      width: 300px;

      background: #1B448933;
      border: 1px solid #1B4489;

      box-sizing: border-box;
    }

    #unity-progress-bar-full {
      background: #1B4489;
    }

    #unity-container,
    #unity-canvas-container {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;

      touch-action: none;
    }
  </style>
</head>

<body>

  <div id="rotateMessage" style="
            display:none;
            position:fixed;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.6);
            color:white;
            z-index:9999;
            justify-content:center;
            align-items:center;
            font-size:24px;
            text-align:center;">
    يرجى تدوير جهازك إلى الوضع الأفقي
  </div>
  <div id="unity-container">

    <div id="unity-canvas-container">
      <canvas id="unity-canvas"></canvas>
    </div>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

  </div>

  <script>
      function checkOrientation() {
    if (window.innerHeight > window.innerWidth) {
      document.getElementById("rotateMessage").style.display = "flex";
      document.getElementById("unity-container").style.display = "none";
    } else {
      document.getElementById("rotateMessage").style.display = "none";
      document.getElementById("unity-container").style.display = "block";
    }

    //resizeCanvas
    const canvas = document.querySelector("#unity-canvas-container");
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
  }

    var buildUrl = "Build";

    var loaderUrl =
      buildUrl + "/The Focus Github Pages.loader.js";

    var config = {
      dataUrl:
        buildUrl + "/The Focus Github Pages.data",

      frameworkUrl:
        buildUrl + "/The Focus Github Pages.framework.js",

      codeUrl:
        buildUrl + "/The Focus Github Pages.wasm",



        streamingAssetsUrl: "StreamingAssets",

      companyName: "Ula",

      productName: "The Focus",

      productVersion: "1.0",
    };


    var container =
      document.querySelector("#unity-container");

    var canvas =
      document.querySelector("#unity-canvas");

    var canvasContainer =
      document.querySelector("#unity-canvas-container");

    var loadingBar =
      document.querySelector("#unity-loading-bar");

    var progressBarFull =
      document.querySelector("#unity-progress-bar-full");

    var unityInstance = null;




    loadingBar.style.display = "block";


    /*
     * Load Unity WebGL
     */
    var script =
      document.createElement("script");

    script.src = loaderUrl;


    script.onload = () => {

      createUnityInstance(

        canvas,

        config,

        (progress) => {

          progressBarFull.style.width =
            100 * progress + "%";

        }

      ).then((instance) => {

        unityInstance = instance;

        loadingBar.style.display = "none";
        checkOrientation();
        window.addEventListener("resize", checkOrientation);
        window.addEventListener("orientationchange", checkOrientation);

      }).catch((message) => {

        alert(message);

      });

    };


    document.body.appendChild(script);

  </script>

</body>

</html>
